<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login — NORTHWIND</title>
    <link href="{{ url_for('static', filename='vendor/inter.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap.purged.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='admin-login.css') }}" rel="stylesheet">
</head>
<body>
    <form class="login-card" method="post" action="{{ url_for('admin_login') }}">
        <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>Admin login</h1>
        <p class="sub">Enter your credentials to manage deductions.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next or '' }}">

        <label for="adminUsername">Username</label>
        <input id="adminUsername" type="text" name="username" placeholder="Your username"
               autocomplete="username" autofocus required>
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" name="password"
               autocomplete="current-password" required>
        <button class="login-btn" type="submit"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
        <a class="back" href="{{ url_for('landing') }}"><i class="bi bi-chevron-left"></i> Back</a>
    </form>
</body>
</html>
