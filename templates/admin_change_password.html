{% extends "base.html" %}
{% block title %}Change Password — NORTHWIND{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<link href="{{ url_for('static', filename='admin-change-password.css') }}" rel="stylesheet">

<div class="pw-card">
    <h2><i class="bi bi-key-fill"></i> Change your password</h2>
    <p class="hint">Signed in as {{ session.get('admin_display_name') }}.</p>
    <form method="post" action="{{ url_for('admin_change_password') }}">
        <div class="pw-field">
            <label>Current password</label>
            <input type="password" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="pw-field">
            <label>New password</label>
            <input type="password" name="new_password" autocomplete="new-password"
                   minlength="10" placeholder="Min 10 characters" required>
        </div>
        <div class="pw-field">
            <label>Confirm new password</label>
            <input type="password" name="confirm_password" autocomplete="new-password"
                   minlength="10" required>
        </div>
        <button class="save-btn" type="submit">Update password</button>
    </form>
</div>
{% endblock %}
